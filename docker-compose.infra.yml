services:
  user-db:
    image: postgres:16-alpine
    container_name: my-postgres
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "25432:5432"
    volumes:
      - ./.docker-volumes/user-db:/var/lib/postgresql/data

  order-db:
    image: postgres:16-alpine
    container_name: order_service_db
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_USER: ${ORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "25433:5432"
    volumes:
      - ./.docker-volumes/order-db:/var/lib/postgresql/data

  hub-db:
    image: postgis/postgis:16-3.4
    container_name: hub_service_db
    environment:
      POSTGRES_DB: hub_service_db
      POSTGRES_USER: ${HUB_DB_USERNAME}
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD}
    ports:
      - "25434:5432"
    volumes:
      - ./.docker-volumes/hub-db:/var/lib/postgresql/data

  company-db:
    image: postgis/postgis:16-3.4
    container_name: company_service_db
    environment:
      POSTGRES_DB: company_service_db
      POSTGRES_USER: ${COMPANY_DB_USERNAME}
      POSTGRES_PASSWORD: ${COMPANY_DB_PASSWORD}
    ports:
      - "25435:5432"
    volumes:
      - ./.docker-volumes/company-db:/var/lib/postgresql/data

  delivery-db:
    image: postgres:16-alpine
    container_name: delivery_service_db
    environment:
      POSTGRES_DB: delivery_service_db
      POSTGRES_USER: ${DELIVERY_DB_USERNAME}
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD}
    ports:
      - "25436:5432"
    volumes:
      - ./.docker-volumes/delivery-db:/var/lib/postgresql/data

  operations-db:
    image: postgres:16-alpine
    container_name: operations_service_db
    environment:
      POSTGRES_DB: operations_service_db
      POSTGRES_USER: ${OPERATIONS_DB_USERNAME}
      POSTGRES_PASSWORD: ${OPERATIONS_DB_PASSWORD}
    ports:
      - "25437:5432"
    volumes:
      - ./.docker-volumes/operations-db:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: msa-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "26379:6379"
    volumes:
      - ./.docker-volumes/redis:/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: my-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "18080:8080"
    command: start-dev
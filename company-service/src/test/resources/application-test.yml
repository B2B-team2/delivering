spring:
  application:
    name: company-service
  datasource:
    url: jdbc:h2:mem:companydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS "company-db"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: company-db
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
    instances:
      companyCircuitBreaker:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      companyTimeLimiter:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 100ms
    instances:
      companyRetry:
        baseConfig: default


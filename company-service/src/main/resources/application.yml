spring:
  application:
    name: company-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/delivering
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: company
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    schemas: company
    default-schema: company
    create-schemas: true
    locations: classpath:db/migration

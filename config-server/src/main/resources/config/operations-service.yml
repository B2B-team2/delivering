server:
  port: 19096

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivering
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: operation-db
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    schemas: operation-db
    default-schema: operation-db
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health

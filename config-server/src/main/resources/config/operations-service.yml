server:
  port: 19096

spring:
  datasource:
    url: ${OPERATIONS_DB_URL}
    username: ${OPERATIONS_DB_USERNAME}
    password: ${OPERATIONS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: operation-db
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    schemas: operation-db
    default-schema: operation-db
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 19094

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway가 스키마 관리, JPA는 검증
    properties:
      hibernate:
        default_schema: order-db
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false         # SQL 출력 비활성화 (debug 로깅으로 제어)
  flyway:
    schemas: order-db       # Flyway가 관리할 스키마
    locations: classpath:db/migration # 마이그레이션 파일 위치
    validate-on-migrate: true

feign:
  client:
    config:
      default:
        connectTimeout: 3000   # 연결 타임아웃 3초
        readTimeout: 5000      # 읽기 타임아웃 5초

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10                    # 최근 10회 호출 기준으로 실패율 계산
        failureRateThreshold: 50                 # 실패율 50% 초과 시 OPEN
        waitDurationInOpenState: 10s             # OPEN 상태 10초 유지 후 HALF-OPEN 시도
        permittedNumberOfCallsInHalfOpenState: 3 # HALF-OPEN 상태에서 3회 테스트 호출
        registerHealthIndicator: true
        ignoreExceptions:
          - com.sparta.common.dto.BusinessException  # 비즈니스 예외는 회로 실패율에 미포함
    instances:
      companyClient:
        baseConfig: default
      hubClient:
        baseConfig: default
      deliveryClient:
        baseConfig: default
      productClient:
        baseConfig: default

logging:
  level:
    org.hibernate.SQL: DEBUG                        # SQL 쿼리 (debug 모드에서만 출력)
    org.hibernate.orm.jdbc.bind: TRACE              # 바인딩 파라미터 값

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

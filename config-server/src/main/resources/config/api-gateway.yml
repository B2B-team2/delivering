server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/delivery-managers/**,/api/v1/admin/**
        - id: order-service-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**,/api/v1/drafts/**,/api/v1/payments/**
        - id: company-service-route
          uri: lb://COMPANY-SERVICE
          predicates:
            - Path=/api/v1/companies/**,/api/v1/products/**,/api/v1/categories/**,/api/v1/product-options/**
        - id: delivery-service-route
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/v1/deliveries/**,/api/v1/delivery-addresses/**
        - id: hub-service-route
          uri: lb://HUB-SERVICE
          predicates:
            - Path=/api/v1/hubs/**,/api/v1/warehouses/**,/api/v1/inventory/**,/api/v1/hub-routes/**
        - id: operations-service-route
          uri: lb://OPERATIONS-SERVICE
          predicates:
            - Path=/api/v1/claims/**,/api/v1/slack/**,/api/v1/ai/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

server:
  port: 19092

spring:
  datasource:
    url: ${COMPANY_DB_URL}
    username: ${COMPANY_DB_USERNAME}
    password: ${COMPANY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: company-db
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    schemas: company-db
    default-schema: company-db
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
